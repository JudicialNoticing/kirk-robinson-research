# ops/site/site.yml — THE PUBLISH ALLOW-LIST AND SITE CONFIG
#
# This file governs what the public site contains. `scripts/build-site.py` reads it and
# stages ONLY what is marked `publish`. Nothing is included by being present on disk.
#
# state:
#   publish  — staged and rendered
#   hold     — NOT staged. Owner decision pending (Phase 2). Listed in the build report.
#   never    — NOT staged, and not a flag to flip casually. Reason is recorded.
#
# ⚠ Changing a `never` to anything else is an owner action with a reason written here.
# ⚠ `url` values are the CITATION NAMESPACE once published. Treat them as frozen.
#
# Created 2026-09-17 (Phase 1). NOT DEPLOYED — local build only.
#
# OWNER RULINGS, 2026-09-17 (Q-190). The states below are no longer defaults:
#   * `[PROVISIONAL]` material PUBLISHES, with its banner. 29 of the 53 staged pages carry
#     the token; each says on its face that it has not completed a verification cycle and
#     is not citable. Do not quietly widen this to mean provisional findings are settled.
#   * Process records STAY HELD — the ACQ acquisition logs, the AUDIT/REVIEW passes,
#     `CR-WATCH-log`, and the session-state files. The site is evidence files and roadmaps.
#   * Licence: CC BY 4.0 for the library's prose, MIT for `scripts/`, and NOTHING for the
#     artifact banks, which are third-party material (see /LICENSE). This is why the banks
#     are excluded wholesale below and not merely deprioritised.

site:
  name: "Kirk Robinson Research"
  description: "An open-source research library separating what the primary record establishes from what is merely asserted."
  # Set before any deploy. Until then the build emits noindex.
  url: ""
  noindex: true   # Phase 2 gate: flip only when the owner rules on publication.

# Injected beneath the H1 of every page that names the case or the defendant.
# Wording is the owner's ruling of 2026-09-16 (START-HERE §0AH item 4), verbatim.
posture_banner: >-
  Bound over on all seven counts on 2026-09-01 (signed order held at Tier 1,
  clerk's certificate 09/02/2026); not-guilty pleas entered by counsel the same day;
  presumption of innocence applies in full.

# Hard exclusions applied before anything else, by path prefix.
exclude_trees:
  - path: "verification/"
    reason: "verification-cycle banks: agent journals, frozen snapshots, process evidence"
  - path: "archive/"
    reason: "superseded material by definition"
  - path: ".venv-site/"
    reason: "build environment"
  - path: ".site-build/"
    reason: "build output"
  - path: "__pycache__/"
    reason: "build artifacts"
  - path: "ops/"
    reason: "operational text incl. deployed routine prompts"
  - path: "scripts/"
    reason: "tooling"
  - path: "docs/research-verification-kit/"
    reason: "third-party kit, carries its own MANIFEST and licence question"
  - path: "docs/discussion-framework/"
    reason: "T4 import; Q-185 undecided"

# Every artifact bank (any subdirectory inside a topic folder) is excluded wholesale:
# 103 banked raw news-article bodies live in these, and republishing full copies is a
# different posture from archiving them. Cite by URL + hash instead.
exclude_bank_subdirs: true

# Named hard blocks. Each of these is ALSO inside an excluded tree; it is named here so it
# appears in every build report as deliberately blocked, not merely as something the folder
# rules happened to catch. An exclusion nobody can see is an exclusion nobody can audit.
never_publish:
  - src: "files - Court record/CR-ACQ-2026-07-27_court-record-artifacts/2026-08-01_UNREVIEWED-DRAFT_losee_DO-NOT-PUBLISH.md"
    reason: "unreviewed draft; v1.2 findings [PROVISIONAL]; the file's own status line says STILL DO NOT PUBLISH"
  - src: "files - Court record/CR-ACQ-2026-07-27_court-record-artifacts/2026-08-01_BLOCKED-DRAFT_q08-dna_DO-NOT-PUBLISH.md"
    reason: "blocked draft, [PROVISIONAL]; Q-07 legal gate has never been cleared"

